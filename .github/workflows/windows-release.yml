name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        run: python scripts/build_windows_installer.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*-windows-x64-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer not found" }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
          "$($hash.Hash)  $($installer.Name)" | Out-File -Encoding ascii "$($installer.FullName).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTSM-RAG-windows-installer
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.sha256
