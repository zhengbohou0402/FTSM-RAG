# Chat 模型名由 .env 中的 CHAT_MODEL_NAME 覆盖；此处为兜底默认值。
# Vertex AI 可选：gemini-3.5-flash / gemini-3.5-pro / gemini-2.5-pro / gemini-2.5-flash
# DashScope 可选：qwen3-max / qwen-plus / qwen-turbo
chat_model_name: gemini-3.5-flash
# gemini-embedding-001：最新 Gemini 原生 embedding，支持最高 3072 维（MRL），多语言统一模型
# text-embedding-005：旧版，768 维，仅英语/代码，已列为 Legacy
embedding_model_name: gemini-embedding-001
image_model_name: qwen-vl-plus
