server:
  port: ${FTSM_KNOWLEDGE_PORT:8103}

spring:
  application:
    name: ftsm-knowledge
  datasource:
    url: jdbc:mysql://${FTSM_MYSQL_HOST:127.0.0.1}:3306/ftsm_knowledge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Kuala_Lumpur
    username: ${FTSM_MYSQL_USER:root}
    password: ${FTSM_MYSQL_PASSWORD:ftsm123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${FTSM_RABBITMQ_HOST:127.0.0.1}
    port: ${FTSM_RABBITMQ_PORT:5672}
    username: ${FTSM_RABBITMQ_USER:guest}
    password: ${FTSM_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
