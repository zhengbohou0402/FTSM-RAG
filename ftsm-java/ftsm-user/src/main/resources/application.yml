server:
  port: ${FTSM_USER_PORT:8101}

spring:
  application:
    name: ftsm-user
  datasource:
    url: jdbc:mysql://${FTSM_MYSQL_HOST:127.0.0.1}:3306/ftsm_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Kuala_Lumpur
    username: ${FTSM_MYSQL_USER:root}
    password: ${FTSM_MYSQL_PASSWORD:ftsm123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ftsm:
  session:
    # Shared with the gateway for stateless verification. MUST be overridden via env in any shared deployment.
    secret: ${FTSM_SESSION_SECRET:dev-only-secret-change-me}

logging:
  level:
    com.ftsm.user: INFO
